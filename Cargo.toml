[package]
name = "mpp"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Muaz++: a language and compiler for A/B tests, stats, model tests and local LLM tests"
license = "MIT"

[[bin]]
name = "mpp"
path = "src/main.rs"

[dependencies]
clap = { version = "~4.6", features = ["derive"] }
codespan-reporting = "~0.13"
indexmap = { version = "~2.14", features = ["serde"] }
postcard = { version = "~1.1", default-features = false, features = ["use-std"] }
rustyline = "~18.0"
serde = { version = "~1.0", features = ["derive", "rc"] }
serde_json = { version = "~1.0", features = ["preserve_order"] }
csv = "~1.4"
sha2 = "~0.11"
ureq = { version = "~3.4", default-features = false, features = ["json", "rustls"] }
regex = "~1.13"
lsp-server = "~0.10"
statrs = { version = "~0.19", default-features = false, features = ["std"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
